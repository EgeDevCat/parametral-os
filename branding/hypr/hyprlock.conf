# Parametral lock screen.
#
# Same language as the rest of the system: the wallpaper behind glass, one clock, one field.
# Nothing here pretends to be a login manager — the session stays alive, this only hides it.

background {
    monitor =
    path = /usr/share/wallpapers/Parametral/contents/images/2560x1440.png
    blur_passes = 3
    blur_size = 6
    brightness = 0.7
    color = rgba(11, 15, 20, 1.0)
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +%H:%M)"
    color = rgb(E9E4D8)
    font_family = Noto Sans
    font_size = 76
    position = 0, 150
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] echo "$(LC_TIME=tr_TR.utf8 date '+%A, %d %B' | tr '[:upper:]' '[:lower:]')"
    color = rgb(154, 164, 178)
    font_family = Noto Sans
    font_size = 14
    position = 0, 88
    halign = center
    valign = center
}

label {
    monitor =
    text = Parametral OS
    color = rgb(E0A93B)
    font_family = Noto Sans
    font_size = 12
    position = 0, -190
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.32
    dots_center = true
    outer_color = rgb(E0A93B)
    inner_color = rgb(18, 23, 30)
    font_color = rgb(E9E4D8)
    font_family = Noto Sans
    fade_on_empty = false
    rounding = 12
    check_color = rgb(E0A93B)
    fail_color = rgb(D66056)
    capslock_color = rgb(E0A93B)
    placeholder_text = şifre
    position = 0, -60
    halign = center
    valign = center
}
