[package]
name = "parametral-calculator"
version = "0.1.0"
edition = "2021"
description = "Parametral OS calculator — the first first-party Rust application"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.29"

[profile.release]
opt-level = "s"
lto = true
strip = true
