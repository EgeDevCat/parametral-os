[package]
name = "parametral-snapshots"
version = "0.1.0"
edition = "2021"
description = "Parametral snapshots — see, create and roll back the system state"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.29"
serde_json = "1.0"
parametral-ui = { path = "../parametral-ui" }

[profile.release]
opt-level = "s"
lto = true
strip = true
