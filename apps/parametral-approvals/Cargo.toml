[package]
name = "parametral-approvals"
version = "0.1.0"
edition = "2021"
description = "Parametral OS approval gate — the human side of the AI permission model"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.29"
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
