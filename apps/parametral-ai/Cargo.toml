[package]
name = "parametral-ai"
version = "0.1.0"
edition = "2021"
description = "Parametral AI — the desktop app for the assistant: status, approvals, audit, model"

[dependencies]
eframe = { version = "0.29", default-features = false, features = [
    "default_fonts",
    "glow",
    "x11",
    "wayland",
] }
egui = "0.29"
serde_json = "1.0"

[profile.release]
opt-level = "s"
lto = true
strip = true
