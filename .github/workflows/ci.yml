name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build and runtime dependencies
        run: |
          pacman -Syu --noconfirm --needed git python bubblewrap btrfs-progs \
            gcc make jq util-linux libseccomp libsodium

      - uses: actions/checkout@v4

      - name: Unprivileged test user (production runs as a service user, not root)
        run: |
          useradd -m tester
          chown -R tester:tester "$GITHUB_WORKSPACE"

      - name: Build the seccomp guard
        run: runuser -u tester -- make guard

      - name: Unit and integration tests
        run: runuser -u tester -- make test

      - name: Committed deny-list signature verifies with the committed public key
        run: runuser -u tester -- env PYTHONPATH=src python3 -m parametral.cli harddeny verify

      - name: Isolation proof (bwrap must work in this runner)
        run: runuser -u tester -- make proof

      - name: Two-process smoke test
        run: runuser -u tester -- bash scripts/smoke.sh

      - name: No swallowed exceptions
        run: |
          if grep -rn "except:" src/ ; then
            echo "bare except found"; exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: proofs
          path: proofs/
